    <style>
        :root {
            --mc-bg-dark: rgba(18, 18, 22, 0.94);
            --mc-gui-bg: #c6c6c6;
        }
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1120;
            font-family: 'VT323', 'Noto Sans TC', sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }
        .mc-hud-box {
            background: var(--mc-bg-dark);
            border: 3px solid #2e2e38;
            box-shadow: inset 0 0 0 2px #4a4a5a, 0 6px 0 rgba(0,0,0,0.5);
            color: #fff;
            text-shadow: 2px 2px 0 #000;
        }
        .mc-gui-window {
            background-color: var(--mc-gui-bg);
            border-top: 4px solid #fff;
            border-left: 4px solid #fff;
            border-right: 4px solid #555;
            border-bottom: 4px solid #555;
            box-shadow: 0 0 0 3px #000, 0 12px 28px rgba(0,0,0,0.75);
            color: #222;
        }
        .mc-slot {
            background-color: #8b8b8b;
            border-top: 3px solid #373737;
            border-left: 3px solid #373737;
            border-right: 3px solid #fff;
            border-bottom: 3px solid #fff;
        }
        .mc-mini-slot {
            background-color: rgba(28, 30, 38, 0.92);
            border-top: 2px solid #6b7280;
            border-left: 2px solid #6b7280;
            border-right: 2px solid #111827;
            border-bottom: 2px solid #111827;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            cursor: pointer;
        }
        .mc-mini-slot:hover {
            background-color: rgba(59, 130, 246, 0.4);
        }
        .mc-mini-slot.active-state {
            border-top-color: #fbbf24;
            border-left-color: #fbbf24;
            border-right-color: #d97706;
            border-bottom-color: #d97706;
            background-color: rgba(37, 99, 235, 0.65);
        }
        .mc-btn {
            background-color: #7d7d7d;
            border-top: 3px solid #bababa;
            border-left: 3px solid #bababa;
            border-right: 3px solid #3b3b3b;
            border-bottom: 3px solid #3b3b3b;
            outline: 2px solid #000;
            color: #fff;
            text-shadow: 2px 2px 0 #1f1f1f;
            cursor: pointer;
        }
        .mc-btn:hover {
            background-color: #6b7ba8;
            color: #ffff77;
        }
        .mc-btn-emerald {
            background-color: #167c36;
            border-top-color: #4ade80;
            border-left-color: #4ade80;
            border-right-color: #064e20;
            border-bottom-color: #064e20;
        }
        .mc-btn-redstone {
            background-color: #991b1b;
            border-top-color: #f87171;
            border-left-color: #f87171;
            border-right-color: #450a0a;
            border-bottom-color: #450a0a;
        }
        .marker-label {
            position: absolute;
            transform: translate(-50%, -100%);
            pointer-events: auto;
            cursor: pointer;
            z-index: 15;
            white-space: nowrap;
        }
        .marker-label.selected .marker-badge {
            border-color: #ffff55;
            background: rgba(20, 45, 85, 0.96);
            box-shadow: 0 0 15px rgba(255,255,85,0.8);
        }
        .marker-badge {
            background: rgba(15, 18, 26, 0.9);
            border: 2px solid #fff;
            box-shadow: 0 0 0 2px #000;
            padding: 3px 8px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            text-shadow: 1px 1px 0 #000;
        }
        .marker-pin {
            width: 0;
            height: 0;
            margin: 0 auto;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #fff;
        }
        /* 手機寬度不足以容納 nowrap 長名稱；width:max-content 避免標籤靠近螢幕右緣時被 absolute 的可用寬度壓成一個字寬 */
        @media (max-width: 639px) {
            .marker-label { width: max-content; }
            .marker-badge {
                max-width: 42vw;
                white-space: normal;
                line-height: 1.15;
            }
        }
        .floating-widget {
            position: fixed;
            z-index: 40;
            touch-action: none;
            user-select: none;
        }
        .drag-handle {
            cursor: grab;
            background: linear-gradient(90deg, #1e293b, #334155, #1e293b);
            border-bottom: 2px solid #0f172a;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
        /* 手機（含橫向，低高度 <500）上收合圖鑑卡只剩標題列，並縮窄到控制台（w-60=240px）右側，才不會蓋住控制台底部的快捷列；
           不用 translateY 是因為拖曳時會把 getBoundingClientRect 的位置寫回 top/left，位移會被重複計算 */
        @media (max-width: 639px), (max-height: 499px) {
            #crafting-modal.inspector-collapsed {
                width: auto;
                min-width: 56px;
                max-width: calc(100vw - 272px);
            }
            #crafting-modal.inspector-collapsed #inspector-drag-handle ~ div,
            #crafting-modal.inspector-collapsed #modal-category-badge,
            #crafting-modal.inspector-collapsed #inspector-compact-btn { display: none; }
            #modal-title::before { content: '▼ '; }
            #crafting-modal.inspector-collapsed #modal-title::before { content: '▲ '; }
        }
        /* 任務情境地圖 */
        .map-pin { position: absolute; transform: translate(-50%, -100%); cursor: pointer; z-index: 3; white-space: nowrap; background: none; border: 0; padding: 0; }
        .map-pin .pin-badge { background: rgba(15, 18, 26, 0.92); border: 2px solid #fff; box-shadow: 0 0 0 2px #000; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 6px; text-shadow: 1px 1px 0 #000; display: flex; gap: 4px; align-items: center; font-family: 'Noto Sans TC', sans-serif; }
        .map-pin:hover .pin-badge { background: rgba(59, 130, 246, 0.9); }
        .map-pin.active .pin-badge { border-color: #ffff55; background: rgba(20, 45, 85, 0.96); box-shadow: 0 0 0 2px #000, 0 0 14px rgba(255, 255, 85, 0.85); }
        .map-pin .pin-tip { width: 0; height: 0; margin: 0 auto; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #fff; }
        .map-van { position: absolute; font-size: 24px; z-index: 4; transition: left 1s ease-in-out, top 1s ease-in-out; filter: drop-shadow(2px 2px 0 #000); pointer-events: none; }
        .scenario-card { font-family: 'Noto Sans TC', sans-serif; }
        #mission-card p, #mission-status { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="select-none overflow-hidden">

    <div id="canvas-container"></div>
    <div id="labels-container" class="inset-0 pointer-events-none fixed z-10 overflow-hidden"></div>

    <!-- HUD Header -->

                <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                        <h1 id="hud-title" class="text-sm sm:text-base font-black text-yellow-300 truncate">央廣1號 Rti 行動廣播車 · 3D 模型</h1>
                        <span id="hud-view-mode" class="bg-emerald-800 border border-emerald-400 text-[10px] px-1 text-emerald-100 font-bold shrink-0">車外全覽</span>
                        <span id="hud-scene" class="hidden sm:inline bg-sky-800 border border-sky-400 text-[10px] px-1 text-sky-100 font-bold shrink-0">🏠 央廣基地</span>
                    </div>
                    <p class="text-[10px] sm:text-xs text-gray-300 truncate">Rti On the Go</p>
                </div>
            </div>
            <div class="mt-1 pt-1 border-t border-gray-700/80 flex items-center justify-between text-[10px] font-mono">
                <span id="hud-coords" class="text-cyan-300 hidden sm:inline">XYZ: 17.0/13.0/21.0</span>
                <div class="flex items-center gap-1">
                    <span id="hud-plate-label" class="text-gray-400">車牌:</span>
                    <span class="text-yellow-300 font-bold bg-black/60 px-1 border border-yellow-500/50">CER-1928</span>
                    <span id="hud-signal-text" class="text-lime-400 font-bold ml-1">● 待命</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-1 pointer-events-auto flex-wrap justify-end shrink-0">
            <button id="map-hint-btn" onclick="toggleScenarioMap(true)" class="hidden sm:inline-flex mc-btn mc-btn-emerald px-2 py-1 text-xs font-bold animate-pulse" title="任務情境地圖 (M)">🗺️</button>
            <button onclick="switchLanguage()" id="lang-btn" class="mc-btn px-1.5 sm:px-2 py-0.5 sm:py-1 text-xs font-bold" title="中/EN">🌐</button>
            <button onclick="resetCameraOverview()" id="btn-center" class="mc-btn mc-btn-emerald px-1.5 sm:px-2 py-0.5 sm:py-1 text-xs font-bold" title="置中廣播車">🎯</button>
            <button onclick="toggleLabelsVisibility()" id="btn-labels" class="mc-btn px-1.5 sm:px-2 py-0.5 sm:py-1 text-xs font-bold" title="標籤開關">🏷️</button>
            <button onclick="toggleMute()" id="btn-music" class="mc-btn px-1.5 sm:px-2 py-0.5 sm:py-1 text-xs font-bold" title="音樂開關"><span id="audio-icon">🔊</span></button>
        </div>
    </header>

    <!-- Floating Console Widget -->
    <div id="floating-console" class="floating-widget w-60 sm:w-64" style="left: 12px; bottom: 14px;">
        <div id="console-expanded" class="mc-hud-box overflow-hidden shadow-2xl">
            <div id="console-drag-handle" class="drag-handle px-2.5 py-1.5 flex items-center justify-between">
                <span id="console-title" class="text-xs font-bold text-yellow-300">🎮 央廣1號控制台</span>
                <button onclick="toggleConsoleMinimize(event)" class="mc-btn px-1.5 text-[10px]">_</button>
            </div>
            <div class="p-2 grid grid-cols-3 gap-1.5 bg-[#14151c]/90">
                <button id="fbtn-ext" onclick="setCutawayMode(false, true)" class="mc-mini-slot active-state p-1.5 flex flex-col items-center justify-center">
                    <span class="text-base">🏠</span><span id="ext-btn-text" class="text-[10px] font-bold mt-1">車外全覽</span>
                </button>
                <button id="fbtn-int" onclick="setCutawayMode(true, true)" class="mc-mini-slot p-1.5 flex flex-col items-center justify-center">
                    <span class="text-base">🔍</span><span id="int-btn-text" class="text-[10px] font-bold mt-1">車內透視</span>
                </button>
                <button id="fbtn-flip" onclick="toggleLedScreenFlip()" class="mc-mini-slot p-1.5 flex flex-col items-center justify-center">
                    <span class="text-base">📺</span><span id="flip-btn-text" class="text-[10px] font-bold mt-1">電視外翻</span>

                <button onclick="toggleDayNight()" class="mc-mini-slot p-1.5 flex flex-col items-center justify-center">
                    <span id="daynight-icon" class="text-base">☀️</span><span id="daynight-btn-text" class="text-[10px] font-bold mt-1">日夜切換</span>
                </button>
                <button id="fbtn-card" onclick="toggleInspectorCard()" class="mc-mini-slot active-state p-1.5 flex flex-col items-center justify-center">
                    <span class="text-base">📋</span><span id="guide-btn-text" class="text-[10px] font-bold mt-1 text-amber-300">設備圖鑑</span>
                </button>
            </div>
            <div class="px-2 pb-2 bg-[#14151c]/90">
                <button onclick="toggleScenarioMap(true)" class="mc-mini-slot w-full py-1.5 text-[11px] font-bold flex items-center justify-center gap-1"><span>🗺️</span><span id="map-btn-text">任務情境地圖</span></button>
            </div>
            <div class="px-2 pb-2 pt-1 bg-[#14151c]/90 border-t border-gray-700/70">
                <div class="flex items-center justify-between text-[10px] text-gray-400 mb-1">
                    <span id="quickbar-label">⚡ 裝備快捷列：</span><span id="console-current-feat" class="text-cyan-300 font-bold truncate max-w-[110px]"></span>
                </div>

        </div>
        <div id="console-minimized" class="hidden">
            <div id="console-min-drag-handle" class="mc-hud-box px-3 py-2 flex items-center gap-2 border-2 border-yellow-400 shadow-2xl">
                <span class="text-lg">🚐</span><div id="console-mini-label" class="text-[11px] font-black text-yellow-300">控制台</div>
                <button onclick="toggleConsoleMinimize(event)" class="mc-btn px-1.5 text-xs font-bold ml-1">□</button>
            </div>
        </div>
    </div>

    <!-- Crafting Inspector Window -->
    <section id="crafting-modal" class="floating-widget w-[calc(100vw-24px)] sm:w-80 max-w-sm" style="right: 12px; bottom: 14px;">
        <div class="mc-gui-window flex flex-col overflow-hidden shadow-2xl">
            <div id="inspector-drag-handle" class="drag-handle px-2.5 py-1.5 flex items-center justify-between text-white">
                <div class="flex items-center gap-1.5 truncate">
                    <span id="modal-category-badge" class="px-1.5 py-0.2 text-[10px] font-bold bg-blue-700 border border-black shrink-0">車外裝備</span>

                </div>
                <div class="flex items-center gap-1 shrink-0 ml-1">
                    <button id="inspector-compact-btn" onclick="toggleInspectorCompactBody()" class="mc-btn px-1.5 text-[10px]">↕</button>
                    <button onclick="toggleInspectorCard(false)" class="mc-btn mc-btn-redstone px-1.5 text-[10px] font-bold">✕</button>
                </div>
            </div>
            <div class="p-2.5 sm:p-3 max-h-[52vh] sm:max-h-[68vh] overflow-y-auto space-y-2">
                <div class="flex items-center justify-between text-[10px] font-mono bg-gray-300 px-2 py-0.5 border border-gray-500 text-gray-800">
                    <span id="modal-en-title" class="truncate">Loading</span>
                    <span id="modal-power-tag" class="text-emerald-800 font-bold shrink-0"></span>
                </div>
                <div class="bg-[#212126] text-white p-2 border-2 border-[#4a4a55] text-xs leading-relaxed">
                    <p id="modal-description" class="text-gray-100"></p>
                </div>
                <div id="inspector-details-body" class="space-y-2">
                    <div class="bg-[#b0b0b0] border-2 border-[#555] p-2">

                        <div class="flex items-center justify-around gap-1">
                            <div id="crafting-grid" class="grid grid-cols-3 gap-0.5 bg-[#8b8b8b] p-1 border-2 border-[#373737]"></div>
                            <span class="text-lg font-black text-gray-700">➡</span>

                    <button id="next-btn" onclick="cycleFeature(1)" class="mc-btn px-2 py-1 text-[11px] font-bold flex-1">下個 ▶</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Mission Card (目前情境) -->

    <!-- Scenario Map (任務情境地圖) -->

        <div class="mc-gui-window w-full max-w-[620px] max-h-[94vh] overflow-y-auto">
            <div class="drag-handle px-3 py-1.5 flex items-center justify-between text-white" style="cursor: default;">
                <span id="scenario-map-title" class="text-sm font-black text-yellow-300">🗺️ 央廣1號 任務情境地圖</span>
                <button onclick="toggleScenarioMap(false)" class="mc-btn mc-btn-redstone px-1.5 text-[10px] font-bold">✕</button>

                            <pattern id="grassPat" width="20" height="20" patternUnits="userSpaceOnUse">

                            </pattern>
                        </defs>
                        <rect width="400" height="250" fill="url(#grassPat)"/>
                        <!-- 山區 (災區) -->
                        <polygon points="262,92 300,22 338,92" fill="#7c6f64"/>
                        <polygon points="300,92 350,8 400,92" fill="#6b5f55"/>
                        <polygon points="340,26 350,8 360,26" fill="#e5e7eb"/>
                        <g fill="#4b5563"><rect x="300" y="12" width="60" height="14"/><rect x="312" y="4" width="34" height="10"/></g>
                        <polyline points="330,26 324,40 332,40 326,54" fill="none" stroke="#facc15" stroke-width="3"/>
                        <g stroke="#93c5fd" stroke-width="1.5"><line x1="306" y1="28" x2="303" y2="36"/><line x1="316" y1="28" x2="313" y2="36"/><line x1="348" y1="28" x2="345" y2="36"/><line x1="356" y1="28" x2="353" y2="36"/></g>
                        <!-- 河流 -->
                        <path d="M0 158 C 70 138, 130 198, 210 176 S 330 118, 400 138" stroke="#3b8fd9" stroke-width="16" fill="none"/>
                        <!-- 城區 (總統府) -->
                        <g fill="#9ca3af"><rect x="14" y="214" width="22" height="18"/><rect x="128" y="212" width="24" height="22"/><rect x="40" y="232" width="30" height="14"/><rect x="104" y="230" width="20" height="16"/><rect x="150" y="236" width="26" height="12"/></g>

        // --- 3. Texture Generators ---
        function createPixelNoiseTexture(baseHex, variation = 14, size = 16) {
            const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const num = parseInt(baseHex.replace('#', ''), 16);
            const rB = (num >> 16) & 255, gB = (num >> 8) & 255, bB = num & 255;
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const delta = Math.floor((Math.random() - 0.5) * variation * 2);
                    ctx.fillStyle = `rgb(${Math.min(255, Math.max(0, rB + delta))},${Math.min(255, Math.max(0, gB + delta))},${Math.min(255, Math.max(0, bB + delta))})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            const tex = new THREE.CanvasTexture(canvas); tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; return tex;
        }

        // LEFT WALL TEXTURE (Red Geometric Slash & Large Red 'R')
        function fitFont(ctx, text, maxW, maxSz, family, weight) {
            for (let s = maxSz; s >= 12; s -= 2) { ctx.font = `${weight} ${s}px ${family}`; if (ctx.measureText(text).width <= maxW) return s; }
            ctx.font = `${weight} 12px ${family}`; return 12;
        }
        function createLedTextureOpen() {
            const t = UI[currentLang];
            const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, 1024, 512);

            ctx.strokeStyle = 'rgba(234, 179, 8, 0.3)'; ctx.lineWidth = 3;
            for (let i = 0; i < 360; i += 15) {
                const rad = i * Math.PI / 180;
                ctx.beginPath(); ctx.moveTo(512, 256); ctx.lineTo(512 + Math.cos(rad) * 600, 256 + Math.sin(rad) * 600); ctx.stroke();
            }
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 16; ctx.strokeRect(12, 12, 1000, 488);

            ctx.fillStyle = '#dc2626'; ctx.fillRect(40, 40, 944, 110);
            ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
            fitFont(ctx, t.ledLine1, 920, 68, '"Noto Sans TC", sans-serif', '900');
            ctx.fillText(t.ledLine1, 512, 120);

            ctx.fillStyle = '#facc15'; ctx.shadowColor = '#000'; ctx.shadowBlur = 12;
            fitFont(ctx, t.ledLine2, 920, 85, '"Noto Sans TC", sans-serif', '900');
            ctx.fillText(t.ledLine2, 512, 290); ctx.shadowBlur = 0;

            ctx.fillStyle = '#38bdf8';
            fitFont(ctx, t.ledLine3, 920, 36, 'monospace', 'bold');
            ctx.fillText(t.ledLine3, 512, 410);
            ctx.textAlign = 'left';

            const tex = new THREE.CanvasTexture(canvas); tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; return tex;
        }

        function makeWidgetDraggable(widgetEl, handleElements) {
            if (!widgetEl) return;
            // 切換語言會重建 UI 並再次呼叫本函式；不先卸載前一次的監聽器，window 與拖曳把手上的 handler 會持續累加
            if (widgetEl.__dragDispose) widgetEl.__dragDispose();
            let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0;
            const onPointerDown = (e) => {
                if (e.target.closest('button')) return;
                isDragging = true; if (controls) controls.enabled = false;
                const rect = widgetEl.getBoundingClientRect(); initialLeft = rect.left; initialTop = rect.top;
                widgetEl.style.left = `${initialLeft}px`; widgetEl.style.top = `${initialTop}px`; widgetEl.style.bottom = 'auto'; widgetEl.style.right = 'auto';
                startX = e.touches ? e.touches[0].clientX : e.clientX; startY = e.touches ? e.touches[0].clientY : e.clientY;
                e.stopPropagation();
            };
            const onPointerMove = (e) => {
                if (!isDragging) return;
                const dx = (e.touches ? e.touches[0].clientX : e.clientX) - startX, dy = (e.touches ? e.touches[0].clientY : e.clientY) - startY;
                const rect = widgetEl.getBoundingClientRect();
                widgetEl.style.left = `${Math.max(6, Math.min(window.innerWidth - rect.width - 6, initialLeft + dx))}px`;
                widgetEl.style.top = `${Math.max(6, Math.min(window.innerHeight - rect.height - 6, initialTop + dy))}px`;
            };
            const onPointerUp = () => { if (isDragging) { isDragging = false; if (controls) controls.enabled = true; } };
            handleElements.forEach(handle => { if (handle) { handle.addEventListener('mousedown', onPointerDown); handle.addEventListener('touchstart', onPointerDown, { passive: true }); }});
            window.addEventListener('mousemove', onPointerMove); window.addEventListener('touchmove', onPointerMove, { passive: true });
            window.addEventListener('mouseup', onPointerUp); window.addEventListener('touchend', onPointerUp);
            widgetEl.__dragDispose = () => {
                handleElements.forEach(handle => { if (handle) { handle.removeEventListener('mousedown', onPointerDown); handle.removeEventListener('touchstart', onPointerDown); }});
                window.removeEventListener('mousemove', onPointerMove); window.removeEventListener('touchmove', onPointerMove);
                window.removeEventListener('mouseup', onPointerUp); window.removeEventListener('touchend', onPointerUp);
            };
        }

        // ---------- 貼圖工具 ----------
        let ANISO = 4;
        function tex(wM, hM, draw, ppm = 400, transparent = false) {

        // 原程式的 Lambert/Basic 顏色是 sRGB 數值，轉成線性以配合 sRGB 輸出
        function fixLegacyColors(root) {
            root.traverse(o => {
                if (!o.isMesh) return;
                (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
                    if (!m || m.userData.srgbDone) return;
                    if (m.isMeshLambertMaterial || m.isMeshBasicMaterial) {
                        if (m.color) m.color.convertSRGBToLinear();
                        if (m.map && m.map !== marqueeTexture) m.map.encoding = THREE.sRGBEncoding;
                    }
                    m.userData.srgbDone = true;
                });
            });
        }

        function setupRaycasting() {
            const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
            let downPos = { x: 0, y: 0 }, downTime = 0;
            const dom = renderer.domElement;
            const visibleChain = o => { while (o) { if (!o.visible) return false; o = o.parent; } return true; };
            dom.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; downTime = performance.now(); });
            dom.addEventListener('pointerup', e => {
                if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 9 || performance.now() - downTime > 500) return;
                const rect = dom.getBoundingClientRect();
                pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1; pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(pointer, camera);
                const hit = raycaster.intersectObject(vanGroup, true).find(h => visibleChain(h.object) && !(h.object.material && h.object.material.opacity === 0));
                if (!hit || !hit.object.userData.featureId) return;
                if (hit.object.userData.isLedScreen) toggleLedScreenFlip();
                selectFeatureById(hit.object.userData.featureId);
            });
        }

        // 只在直立手機 / 其他版面切換時重設鏡頭；每次 resize 都重設會把使用者轉好的視角洗掉（手機網址列伸縮也會觸發 resize）
        let viewportCompact = window.innerWidth < 640 && window.innerHeight > window.innerWidth;
        function onWindowResize() {
            if (!camera || !renderer) return;
            const w = window.innerWidth || 800, h = window.innerHeight || 600;
            camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
            const compact = w < 640 && h > w;
            if (compact !== viewportCompact) {
                viewportCompact = compact;
                const c = scenarioCamera(currentScenario()); cameraLerpTarget = c.p; controlsTargetLerp = c.t;
            }
        }

        function currentScenario() { return SCENARIOS.find(s => s.id === currentScenarioId) || SCENARIOS[0]; }
